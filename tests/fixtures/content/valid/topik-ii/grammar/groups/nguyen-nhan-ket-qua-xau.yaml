contrast_examples:
  - situation_vi: "Đi học trễ vì tắc đường."
    items:
      - member: g-0001
        ko: "길이 막히느라고 늦었어요."
        vi: "Vì tắc đường nên tôi bị trễ."
        ok: false
        note_vi: "Sai: tắc đường không phải việc chủ ngữ đang mải làm."
      - member: g-0002
        ko: "길이 막히는 바람에 늦었어요."
        vi: "Vì tắc đường nên tôi bị trễ."
        ok: true
        note_vi: "Việc tắc đường là bất ngờ, hợp -는 바람에."
