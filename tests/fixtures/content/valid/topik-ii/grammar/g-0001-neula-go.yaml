notes_internal: "Cấp 4 là đánh giá của người soạn (nhiều giáo trình xếp -느라고 ở cấp 3-4). Câu 'có hay không có patchim đều giống nhau' và quy tắc ㄹ rụng là kiến thức ngữ pháp chung. Chưa đối chiếu danh sách 문법 chính thức."
