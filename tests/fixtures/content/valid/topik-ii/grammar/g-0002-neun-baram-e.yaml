id: g-0002
slug: neun-baram-e
pattern: "-는 바람에"
variants: []
meaning_vi: "Vì một việc bất ngờ A xảy ra nên (chẳng may) dẫn đến kết quả không tốt B."
level: 4
level_basis: editor
function: cause
compare_group: nguyen-nhan-ket-qua-xau
form:
  - host: V
    attach: "V-는 바람에 (cả khi việc đã xảy ra vẫn dùng -는, không đổi thành -(으)ㄴ)"
    note_vi: "Động từ có patchim ㄹ thì ㄹ rụng: 놀다 → 노는 바람에. Có thể dùng với động từ phủ định: -지 못하는 바람에."
constraints:
  register: both
  polarity: negative
  subject_vi: "Hai vế có thể khác chủ ngữ (khác -느라고)."
  tense_vi: "Không gắn -았/었- vào -는 바람에. Vế sau thường ở quá khứ vì là kết quả đã xảy ra; cũng có thể là phỏng đoán về hệ quả (갑자기 일이 생기는 바람에 못 갈 것 같아요)."
  main_clause_vi: "Vế sau là kết quả không tốt, ngoài dự tính. Không dùng mệnh lệnh hoặc đề nghị."
  other_vi: "Chủ yếu đi với động từ. Vế trước là sự việc đột xuất, ngoài ý muốn; không dùng cho việc diễn ra thường xuyên, dự đoán được."
examples:
  - ko: "갑자기 비가 오는 바람에 소풍을 취소했어요."
    vi: "Vì trời bỗng mưa nên chúng tôi hủy buổi dã ngoại."
  - ko: "길이 막히는 바람에 약속 시간에 늦었어요."
    vi: "Vì tắc đường nên tôi trễ giờ hẹn."
  - ko: "동생이 컴퓨터를 만지는 바람에 파일이 다 지워졌어요."
    vi: "Vì em tôi nghịch máy tính nên tất cả tệp bị xóa mất."
    note_vi: "Khác chủ ngữ giữa hai vế (동생이 / 파일이): -느라고 không dùng được ở đây."
  - ko: "알람 소리를 듣지 못하는 바람에 첫 수업에 지각했다."
    vi: "Vì không nghe thấy tiếng báo thức nên tôi đi học trễ tiết đầu."
  - ko: "옆집에서 갑자기 공사를 시작하는 바람에 낮잠을 못 잤다."
    vi: "Vì nhà bên cạnh đột ngột bắt đầu sửa chữa nên tôi không ngủ trưa được."
non_examples:
  - ko: "시험을 열심히 준비한 바람에 합격했어요."
    fix_ko: "시험을 열심히 준비해서 합격했어요."
    note_vi: "Sai: kết quả tốt thì không dùng -는 바람에; cũng không dùng dạng -(으)ㄴ. Dùng -아/어서."
  - ko: "날씨가 좋은 바람에 소풍을 갔어요."
    fix_ko: "날씨가 좋아서 소풍을 갔어요."
    note_vi: "Sai: 좋다 là tính từ và kết quả tích cực."
  - ko: "늦게 일어나는 바람에 서두르세요."
    fix_ko: "늦게 일어났으니까 서두르세요."
    note_vi: "Sai: vế sau là mệnh lệnh. Dùng -(으)니까."
common_mistakes_vi:
  - "Dùng cho kết quả tốt, vì tiếng Việt 'do... nên' trung tính. Với -는 바람에 kết quả luôn xấu; muốn nói tốt dùng -아/어서 hoặc 덕분에."
  - "Dùng cho nguyên nhân đã dự đoán được hoặc diễn ra thường xuyên (매일 운동하는 바람에...). -는 바람에 cần yếu tố bất ngờ, 'chẳng may'."
  - "Dùng với tính từ. Tính từ không đi với -는 바람에; dùng -(으)ㄴ 탓에 hoặc -아/어서."
  - "Nhầm với -느라고: cùng chủ ngữ và người nói đang bận làm A thì dùng -느라고; sự việc đột xuất, thường khác chủ ngữ thì dùng -는 바람에."
related: [g-0001]
body_md: |
  **Ý cốt lõi:** một việc **xảy ra ngoài ý muốn** làm hỏng kế hoạch hoặc gây kết quả xấu. Nhớ bằng từ **"chẳng may"**: *chẳng may trời mưa nên hủy dã ngoại*.

  **Dấu hiệu nhận ra khi làm bài:** các từ như 갑자기, 그만, 하필 trong câu; vế sau là 취소했다, 늦었다, 망쳤다, 못 -았/었다.

  **Lưu ý ngữ pháp:** 바람 trong cấu trúc này là danh từ phụ thuộc, nên phải viết cách chữ (-는 바람에). Vế sau không dùng mệnh lệnh hay đề nghị.
