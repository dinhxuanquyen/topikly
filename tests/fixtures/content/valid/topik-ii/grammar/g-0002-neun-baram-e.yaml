notes_internal: "Cấp 4 là đánh giá của người soạn. Phần 'không đổi thành -(으)ㄴ' và 'không gắn -았/었-' là kiến thức ngữ pháp chung; trong khẩu ngữ đôi khi gặp -았/었는 바람에, reviewer kiểm có cần nêu như dạng không chuẩn không. Chưa đối chiếu danh sách 문법 chính thức."
