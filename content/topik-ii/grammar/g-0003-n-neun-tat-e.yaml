notes_internal: "Cấp 4 là đánh giá của người soạn; nhiều danh sách xếp -(으)ㄴ/는 탓에 ở cấp 5, reviewer kiểm. Variants -(으)ㄴ/는 탓으로 / -탓이다 là kiến thức chung, chưa đối chiếu nguồn. Nhận xét về văn nói/văn viết ở common_mistakes_vi (mục cuối) là cảm quan của người soạn."
