notes_internal: "Nhóm gồm g-0004, g-0005, g-0006. Sửa 2026-10-21 theo duyệt: -(으)ㄹ 모양이다 có tồn tại (summary, hàng Thì, tình huống 2), cách dùng ngôi thứ nhất khi tự nhận ra, note_vi ok:false bắt đầu 'Sai:', dạng kết thúc theo pattern §5.1, thêm criterion_key. Phần tả sắc thái dựa trên kinh nghiệm ngữ pháp của người soạn; reviewer đã duyệt phân biệt văn phong. Khẳng định về R03–R04 là mô tả chung, không trích từ đề thật."
