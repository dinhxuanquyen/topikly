notes_internal: "Nhóm gồm 2 điểm g-0007, g-0008. Có thể mở rộng thêm -아/어도 (cấp thấp hơn) và -(으)ㄹ지라도 (cấp cao hơn) khi soạn tiếp. Khẳng định trong topik_traps_vi về R01-R04 là mô tả chung của người soạn, không trích từ đề thật; -(으)ㄹ지라도 chưa có điểm ngữ pháp trong repo."
