notes_internal: "Nhóm gồm 3 điểm g-0001, g-0002, g-0003. Sửa 2026-10-21 theo duyệt: đồng bộ với g-0001/g-0003 (văn nói/viết, 있다/없다 + -는, thì của 탓에), thêm criterion_key cho mọi hàng. Các hàng bảng phụ thuộc ràng buộc ghi trong từng điểm; sửa điểm nào thì xem lại bảng. Khẳng định trong topik_traps_vi về R01-R04 là mô tả chung của người soạn, không trích từ đề thật."
