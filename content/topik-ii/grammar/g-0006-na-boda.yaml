notes_internal: "Cấp 3 là đánh giá của người soạn (có giáo trình xếp ở cấp 4), reviewer kiểm. Quy tắc 있다/없다 đi với -나 là kiến thức ngữ pháp chung. Chưa đối chiếu danh sách 문법 chính thức."
