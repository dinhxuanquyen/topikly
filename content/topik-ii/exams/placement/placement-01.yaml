#   còn chờ chốt dạng câu R46 (Phụ lục A11 của content-spec).
# - Bậc 4: r10, r14, r17 là ba câu đơn duy nhất của bậc này; các bộ r19-20 và r23-24 bị bỏ
#   vì ngữ liệu dài.
# - Bậc 5: bỏ bộ r44-45 vì ngữ liệu dài (khoảng 566 ký tự). Bỏ r29 và r40 vì luật nhãn: cả hai
