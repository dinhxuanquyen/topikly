# sổ dài 4 trở lên; mọi chuỗi 3 nhãn liên tiếp cũng khác nhau). Trong bậc 4 và bậc 5, thứ tự
# câu không theo type_code tăng dần vì phải đổi thứ tự để đạt luật nhãn.
