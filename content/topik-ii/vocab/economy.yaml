words:
  - id: v-00013
    hangul: 경제
    hanja: 經濟
    han_viet: kinh tế
    syllables:
      - { ko: 경, hanja: 經, hv: kinh }
      - { ko: 제, hanja: 濟, hv: tế }
    meaning_vi: "kinh tế; (경제적이다) tiết kiệm, có lợi về chi phí"
    pos: noun
    level: 3
    level_basis: editor
    topics: [economy]
    example_ko: "경제가 어려울수록 가계 지출을 줄이는 사람이 많아진다."
    example_vi: "Kinh tế càng khó khăn thì càng có nhiều người cắt giảm chi tiêu gia đình."
    false_friend: null
    collocations:
      - { ko: "경제 성장", vi: "tăng trưởng kinh tế" }
      - { ko: "경제가 어렵다", vi: "kinh tế khó khăn" }
