    notes_internal: "Âm 'thâu' của 輸; đã bỏ alt_hv 'du' khỏi bảng âm tiết vì chưa đối chiếu được (Thiều Chửu chỉ ghi 'thâu'), thêm lại nếu có nguồn. Từ này không để false_friend vì 'thâu nhập' không phải từ Việt thông dụng (chỉ là bẫy âm gần 'thu nhập')."
