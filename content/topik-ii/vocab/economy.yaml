    note_vi: "Chữ 濟 (tế) nghĩa gốc là 'cứu giúp'. Từ 經濟 vốn rút từ ý 'trị nước, cứu giúp dân' (經世濟民 kinh thế tế dân) trước khi mang nghĩa 'kinh tế' hiện đại."
    notes_internal: "Câu note_vi về nguồn gốc 經世濟民 là kiến thức chung của người soạn, chưa đối chiếu nguồn; reviewer kiểm hoặc xoá."

