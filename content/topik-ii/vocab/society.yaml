    meaning_vi: "xã hội"
    pos: noun
    level: 3
    level_basis: editor
    topics: [society]
    example_ko: "우리 사회는 빠르게 변하고 있다."
    example_vi: "Xã hội của chúng ta đang thay đổi nhanh chóng."
    false_friend: null
    collocations:
      - { ko: "사회 문제", vi: "vấn đề xã hội" }
      - { ko: "사회생활", vi: "cuộc sống xã hội; đời đi làm" }
      - { ko: "사회에 나가다", vi: "bước ra xã hội (đi làm)" }
    note_vi: "Giống nghĩa với 'xã hội' tiếng Việt, nên dễ nhớ. Chú ý chữ 社 (xã) khác chữ 事 (sự) trong 사고 事故 dù cùng đọc 사."

  - id: v-00002
    hangul: 인구
    hanja: 人口
    han_viet: nhân khẩu
    syllables:
      - { ko: 인, hanja: 人, hv: nhân }
      - { ko: 구, hanja: 口, hv: khẩu }
    meaning_vi: "dân số; số dân"
    pos: noun
    level: 3
    level_basis: editor
    topics: [population, society]
    example_ko: "이 도시는 해마다 인구가 줄고 있다."
    example_vi: "Dân số của thành phố này giảm đi mỗi năm."
    false_friend: null
    collocations:
      - { ko: "인구가 늘다", vi: "dân số tăng" }
      - { ko: "인구 밀도", vi: "mật độ dân số" }
      - { ko: "인구 감소", vi: "dân số suy giảm" }
    note_vi: "'Nhân khẩu' trong tiếng Việt thường chỉ số người trong một hộ hoặc đơn vị dân cư (hộ khẩu, nhân khẩu), còn tổng số dân của một nước hay thành phố tiếng Hàn gọi là 인구."
    notes_internal: "Không đánh dấu bạn giả vì 'nhân khẩu' vẫn dùng trong 'nhân khẩu học' (= 인구학); reviewer cân nhắc nếu muốn đánh dấu partial."

  - id: v-00003
