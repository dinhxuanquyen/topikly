    hanja: 出産
    han_viet: xuất sản
    syllables:
      - { ko: 출, hanja: 出, hv: xuất }
      - { ko: 산, hanja: 産, hv: sản }
    meaning_vi: "sinh con, sinh đẻ"
    pos: noun
    level: 4
    level_basis: editor
    topics: [population, family]
    example_ko: "출산을 앞둔 직원에게는 휴가를 줍니다."
    example_vi: "Nhân viên sắp sinh con sẽ được cho nghỉ phép."
    false_friend: null
    collocations:
      - { ko: "출산율", vi: "tỉ lệ sinh" }
      - { ko: "출산 휴가", vi: "nghỉ thai sản" }
      - { ko: "저출산", vi: "tỉ lệ sinh thấp" }
    note_vi: "'Xuất sản' hầu như không dùng trong tiếng Việt; nói 'sinh con', 'sinh nở' hoặc 'thai sản'. Hay gặp trong chủ đề dân số: 저출산 (tỉ lệ sinh thấp)."

  - id: v-00004
    hangul: 사고
    hanja: 事故
    han_viet: sự cố
    syllables:
      - { ko: 사, hanja: 事, hv: sự }
      - { ko: 고, hanja: 故, hv: cố }
    meaning_vi: "tai nạn; sự cố bất ngờ"
    pos: noun
    level: 3
    level_basis: editor
    topics: [society, transportation]
    example_ko: "빗길에서는 교통사고가 자주 일어난다."
    example_vi: "Trên đường trơn do mưa, tai nạn giao thông thường xảy ra."
    false_friend:
      kind: partial
      vi_meaning: "việc không mong muốn xảy ra bất ngờ, thường là trục trặc kỹ thuật hoặc hỏng hóc (sự cố điện, sự cố máy móc)"
      note_vi: "Trùng 'sự cố' ở nghĩa việc không mong muốn xảy ra bất ngờ. Khác ở trọng tâm: 사고 hay chỉ tai nạn có thiệt hại về người hoặc của (교통사고 = tai nạn giao thông), còn 'sự cố' tiếng Việt thiên về trục trặc kỹ thuật."
    collocations:
      - { ko: "교통사고", vi: "tai nạn giao thông" }
      - { ko: "사고가 나다", vi: "xảy ra tai nạn" }
      - { ko: "사고를 당하다", vi: "gặp tai nạn" }
    note_vi: "Đồng âm khác chữ Hán: 사고 思考 (tư khảo) = suy nghĩ. Cũng đừng nhầm 事 (sự) với 社 (xã) trong 사회."
    notes_internal: "Phân loại partial theo mức trùng nghĩa 'sự cố'; reviewer xác nhận."

  - id: v-00005
    hangul: 유행
    hanja: 流行
    han_viet: lưu hành
    syllables:
      - { ko: 유, hanja: 流, hv: lưu }
      - { ko: 행, hanja: 行, hv: hành }
    meaning_vi: "mốt, trào lưu; thịnh hành; (bệnh) lan rộng"
    pos: noun
    level: 4
    level_basis: editor
    topics: [culture, society]
    example_ko: "이번 겨울에는 긴 외투가 유행이에요."
    example_vi: "Mùa đông này áo khoác dài đang thịnh hành."
    false_friend:
      kind: partial
      vi_meaning: "(sản phẩm, tiền tệ, ấn phẩm) được đưa vào dùng và lưu thông trên thị trường; (bệnh) đang có mặt ở một vùng"
      note_vi: "Trùng 'lưu hành' ở nghĩa bệnh lan rộng trong cộng đồng (독감이 유행하다 = cúm đang lan). Khác ở nghĩa phổ biến nhất: 유행 là mốt, trào lưu được nhiều người chạy theo (유행에 민감하다 = nhạy với mốt), không phải việc sản phẩm được phát hành."
    collocations:
      - { ko: "유행하다", vi: "thịnh hành; lan rộng" }
      - { ko: "유행이 지나다", vi: "hết mốt" }
      - { ko: "유행을 따르다", vi: "chạy theo mốt" }
    notes_internal: "Phân loại partial; kiểm lại nghĩa 'lưu hành' hiện đại trong tiếng Việt."

