  - id: v-00009
    hangul: 자원
    hanja: 資源
    han_viet: tư nguyên
    syllables:
      - { ko: 자, hanja: 資, hv: tư }
      - { ko: 원, hanja: 源, hv: nguyên }
    meaning_vi: "tài nguyên; nguồn lực"
    pos: noun
    level: 4
    level_basis: editor
    topics: [environment, economy]
    example_ko: "자원이 부족한 나라일수록 기술 개발이 중요하다."
    example_vi: "Nước càng thiếu tài nguyên thì phát triển kỹ thuật càng quan trọng."
    false_friend: null
    collocations:
      - { ko: "천연자원", vi: "tài nguyên thiên nhiên" }
      - { ko: "자원을 아끼다", vi: "tiết kiệm tài nguyên" }
      - { ko: "자원이 풍부하다", vi: "giàu tài nguyên" }
    note_vi: "Âm Hán-Việt là 'tư nguyên' (資 = tư, như 資本 tư bản). Tiếng Việt nói 'tài nguyên' cho cùng nghĩa, với chữ 財 (tài) khác chữ 資, nên hai âm gần nhau, dễ nhớ. Cũng đừng nhầm 자원 資源 với 자원 自願 (tự nguyện) trong 자원봉사."
    notes_internal: "Sửa theo duyệt 2026-10-21 và quyết định của điều phối: han_viet 'tư nguyên', 資 hv 'tư', bỏ 'tài' khỏi alt_hv của 資. [cần đối chiếu từ điển Hán-Việt] — người dùng quyết nếu muốn giữ 'tài nguyên' (khi đó phải thêm lại alt_hv và nêu rõ đó là cách nói quen của riêng từ này)."

