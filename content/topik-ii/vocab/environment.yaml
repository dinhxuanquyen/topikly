words:
  - id: v-00007
    hangul: 환경
    hanja: 環境
    han_viet: hoàn cảnh
    syllables:
      - { ko: 환, hanja: 環, hv: hoàn }
      - { ko: 경, hanja: 境, hv: cảnh }
    meaning_vi: "môi trường; hoàn cảnh (sống, học tập)"
    pos: noun
    level: 3
    level_basis: editor
    topics: [environment, society]
    example_ko: "우리는 환경을 보호하기 위해 일회용품을 줄이기로 했다."
    example_vi: "Chúng tôi quyết định giảm đồ dùng một lần để bảo vệ môi trường."
    false_friend:
      kind: partial
      vi_meaning: "hoàn cảnh: tình huống, điều kiện cụ thể mà một người gặp phải (hoàn cảnh gia đình, hoàn cảnh khó khăn)"
      note_vi: "Trùng 'hoàn cảnh' ở nghĩa điều kiện xung quanh con người (가정환경 = hoàn cảnh gia đình, 어려운 환경 = hoàn cảnh khó khăn). Khác: nghĩa thông dụng nhất của 환경 là 'môi trường' (환경 오염 = ô nhiễm môi trường), nghĩa này tiếng Việt không dùng 'hoàn cảnh'."
    collocations:
      - { ko: "환경 오염", vi: "ô nhiễm môi trường" }
      - { ko: "환경을 보호하다", vi: "bảo vệ môi trường" }
      - { ko: "가정환경", vi: "hoàn cảnh gia đình" }
      - { ko: "환경에 적응하다", vi: "thích nghi với môi trường" }

