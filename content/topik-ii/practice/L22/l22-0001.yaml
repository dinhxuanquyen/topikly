notes_internal: "2026-10-26: l21-0001 đã soạn (dùng trong Mini test Nghe 01), chỉ sửa notes_internal ở file này. Gợi ý ban đầu cho L21 (중심 생각 của 남자): 'Cho khách hàng tự dùng thử và học cách sử dụng sản phẩm là cách quảng bá hiệu quả hơn bốc thăm trúng thưởng'. Đáp án L22 (địa điểm trong toà nhà công ty) không trùng và không làm lộ ý đó. Transcript khoảng 300 ký tự (không tính nhãn), đếm tay. Khi soạn L21 phải chép nguyên văn transcript_ko/transcript_vi của file này."
