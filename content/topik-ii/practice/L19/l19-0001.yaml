notes_internal: "Transcript khoảng 175 ký tự (không tính nhãn), đếm tay, trong dải 100–180. Độ khó 4 (dải 3–4): nhiễu ④ là ý nhượng bộ '물론 …' của chính nam, người học phải phân biệt ý nhượng bộ với ý chính đứng sau '근데'. Ý chính của nam xuất hiện ở lượt 2 và được nhắc lại ở lượt 4, không dồn vào câu cuối."
