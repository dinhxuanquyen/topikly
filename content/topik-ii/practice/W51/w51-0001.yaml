notes_internal: |
  Tình huống tự soạn: bài đăng trên bảng tin chung cư của người nhận nhầm một kiện hàng (cùng số căn, khác tòa) và đang giữ hộ. Văn bản thực dụng kiểu 안내문/게시글, văn phong -습니다 nên register là formal_polite.
  Độ dài passage: 175 ký tự theo §5.7 (tính khoảng trắng, bỏ xuống dòng), gồm cả dòng tiêu đề (20) và dòng ký tên "101동 503호" (9); thân bài 146. Đếm tay từng câu: 36 + 28 + 35 + 20 + 23 + 4 khoảng trắng giữa câu = 146. Reviewer đếm lại khớp 175. Gần biên trên 180 của §4.6; nếu muốn ngắn hơn thì bỏ "저녁에 " ở câu 1 (−4).
  Căn cứ của hai chỗ trống: ㉠ dựa vào tiêu đề ("잘못 배달된") và câu ngay sau ("동은 다르고 호수만 같아서 …"); ㉡ dựa vào chủ ngữ tôn kính "이 택배의 주인이신 분은", câu sau ("평일에는 저녁 7시 이후에 집에 있습니다") và dòng ký tên (người viết ở 101동 503호).
  Difficulty 3: từ vựng đời sống, hai căn cứ đều nằm sát chỗ trống. Từ khó nhất (헷갈리다, 보관하다) không quyết định đáp án.
  F1 (bản quyền): người soạn và reviewer (content/_reviews/2026-10-26-mini-viet-01.md) đều không thấy đề W51 NIIED hay sách nào có tình huống "kiện hàng giao nhầm do cùng số căn khác tòa".
  Bản sửa 2026-10-26 theo FIX của content/_reviews/2026-10-26-mini-viet-01.md (passage không đổi, vẫn 175 ký tự):
  - ㉠ đáp án 2 đổi thành "저희 집 주소가 아니라 다른 동 주소였습니다" (bản cũ ghép "주소 … 저희 집이 아니라" không cân); đáp án 3 đổi thành "저희 집으로 와야 할 택배가 아니었습니다" (bản cũ "저희 집으로 온 택배가 아니었습니다" mâu thuẫn: hàng đã đến nhà người viết).
  - ㉡ đáp án 1 đổi thành "101동 503호로 찾으러 오시기 바랍니다" (bỏ "저녁 7시 이후에" lặp câu sau; thêm 동 vì chủ hàng cũng ở một căn 503호). required_elements_vi của ㉡ ghi rõ không cần nhắc lại giờ. Partial "503호로 찾으러 오세요" đổi thành "101동 503호로 찾으러 오세요" cho khớp.
  - Lý do của mọi partial_answers chuyển từ comment YAML (bị mất khi parse) vào note_vi của từng chỗ trống; thêm partial ㉠ "동이 달랐습니다", ㉡ "와서 가져가기 바랍니다". common_mistakes_vi mục 3 và 5 ghi rõ mức điểm một phần; scoring_notes_vi liệt kê đủ các trường hợp một phần.
  - "Đáng chú ý": bỏ 평일 (từ sơ cấp), thêm 호수 (號數); mục 기사님 thêm cảnh báo "kỹ sư" và 기사 (記事). Vẫn 8 mục.
  - Không nhận hai gợi ý tuỳ chọn: thêm ㉠ "다른 동 주소가 적혀 있었습니다" (lặp 주소 với vế "주소를 확인해 보니") và ㉡ "저희 집으로 오시면 택배를 돌려 드리겠습니다" (chủ ngữ của vế sau là người viết, dễ làm người học lẫn với lỗi "sai chủ thể" mà rejected_answers đang giải thích).
  Cho hanviet-lexicographer: các từ 택배 (宅配), 배달 (配達), 보관 (保管), 동 (棟 / 洞), 호수 (號數 / 湖水), 기사 (技士 / 記事), 헷갈리다 chưa có trong words; tag grammar:-(으)시기-바랍니다 chưa có trong grammar_points. Cần xác nhận: âm Hán Việt "hiệu số" cho 號數 (號 hiệu, 數 đọc "số" theo nghĩa con số) và trường false_friend của 호수 (號數) (người soạn và reviewer ghi là bạn giả hoàn toàn với "hiệu số" = kết quả phép trừ) và 기사 (技士) (chưa gắn loại bạn giả, chỉ cảnh báo nhầm với "kỹ sư").
