  어제 저녁에 저희 집 문 앞에 택배 상자가 하나 놓여 있었습니다. 그런데 상자에 적힌 주소를 확인해 보니 ( ㉠ ). 동은 다르고 호수만 같아서 택배 기사님이 헷갈리신 것 같습니다. 이 택배의 주인이신 분은 ( ㉡ ). 평일에는 저녁 7시 이후에 집에 있습니다.
  101동 503호
