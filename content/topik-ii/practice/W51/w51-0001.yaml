scoring_notes_vi: |
  Mỗi chỗ trống chấm riêng. Cách chia điểm từng phần theo cấu hình chương trình [cần đối chiếu A12].
  Điểm tối đa: đúng nội dung theo required_elements_vi, đúng văn phong -습니다 (formal_polite), có kính ngữ ở ㉡, và là MỘT câu hoàn chỉnh.
  Điểm một phần: đúng ý nhưng sai văn phong (dùng -아요/-세요); thiếu kính ngữ chủ thể ở ㉡ ("와서 가져가기 바랍니다"); chỉ viết cụm danh từ; ㉠ nói mơ hồ ("주소가 달랐습니다") hoặc chỉ lặp lý do của câu sau ("동이 달랐습니다"); ㉡ thiếu việc lấy hàng ("503호로 오시기 바랍니다") hoặc đề nghị không khớp căn cứ ("연락해 주시기 바랍니다", bài không có số điện thoại). Lý do từng trường hợp ghi ở note_vi của mỗi chỗ trống.
  0 điểm: ngược nghĩa (㉠ "là địa chỉ nhà mình"), sai chủ thể ở ㉡ (lời hứa của người viết thay cho lời đề nghị với chủ hàng), lạc ý, hoặc chép lại nguyên câu trước/sau chỗ trống.
common_mistakes_vi:
  - "Dịch 'đến lấy' thành '와서 가지세요' hoặc '가지시기 바랍니다'. 가지다 là 'có, cầm giữ'; 'lấy rồi mang đi' phải là 가져가다 hoặc 찾아가다."
  - "Trộn -요 (오세요, 아니었어요) vào thông báo đang viết -습니다. W51 chấm cả việc giữ đúng văn phong của văn bản."
  - "Ở ㉠ viết lại lý do của câu sau ('동이 달랐습니다', '동이 달라서 잘못 왔습니다') thay vì nói điều phát hiện được; vừa lặp ý câu sau vừa thiếu ý chính, nên chỉ được điểm một phần."
  - "Bỏ qua chủ ngữ '이 택배의 주인이신 분은' nên ㉡ thành lời hứa của người viết ('제가 갖다 드리겠습니다'), sai chủ thể."
  - "Thiếu kính ngữ chủ thể: chủ ngữ là '주인이신 분은' nên động từ cũng phải có -시- ('오셔서 가져가시기 바랍니다'). Viết '와서 가져가기 바랍니다' chỉ được điểm một phần."
  - "Viết hai câu cho một chỗ trống, ví dụ '503호로 오십시오. 택배를 드리겠습니다.' Mỗi chỗ trống chỉ được một câu."
explanation_vi: |
  **Phân tích đề:** bài đăng trên bảng tin chung cư, văn phong -습니다. Người viết nhận nhầm một kiện hàng và đang giữ hộ. Có 2 chỗ trống, mỗi chỗ viết một câu -습니다. ㉠ là điều phát hiện khi xem địa chỉ; ㉡ là lời đề nghị với chủ hàng.
  **Dàn ý:** ㉠ = "địa chỉ trên hộp không phải nhà tôi (là tòa khác)", viết ở thì quá khứ sau "확인해 보니". ㉡ = "mời chủ hàng đến nhà tôi lấy hàng", dùng -(으)시기 바랍니다 hoặc -(으)십시오.
  **Lưu ý:** ㉠: tiêu đề "잘못 배달된 택배" (kiện hàng giao nhầm) và câu sau "동은 다르고 호수만 같아서 택배 기사님이 헷갈리신 것 같습니다" (khác tòa, chỉ trùng số căn nên chắc anh giao hàng nhầm) cho biết địa chỉ trên hộp là của nhà khác. "그런데" báo hiệu điều bất ngờ, ngược với việc hộp nằm trước cửa nhà mình. ㉡: chủ ngữ "이 택배의 주인이신 분은" (người là chủ kiện hàng này) đòi một lời đề nghị dành cho chủ hàng, có kính ngữ. Câu sau "평일에는 저녁 7시 이후에 집에 있습니다" (ngày thường tôi ở nhà sau 7 giờ tối) và dòng ký tên "101동 503호" cho biết chủ hàng cần đến nhà người viết để lấy.
  **Đáng chú ý:**
  - 택배 (宅配 – trạch phối) – dịch vụ giao hàng tận nhà; kiện hàng được giao
  - 배달되다 (配達 – phối đạt) – được giao tới; 잘못 배달되다 = bị giao nhầm
  - 보관하다 (保管 – bảo quản) – cất giữ, giữ hộ; ở đây người viết giữ hộ kiện hàng cho chủ
  - 동 (棟 – đống) – tòa nhà trong khu chung cư; "101동 503호" = căn 503, tòa 101. Khác 동 (洞 – động) – phường trong địa chỉ hành chính (○○동)
  - 호수 (號數 – hiệu số) – số phòng, số căn ("101동 503호" = căn số 503); khác "hiệu số" (kết quả phép trừ) trong tiếng Việt; cũng khác 호수 (湖水 – hồ thủy) – cái hồ
  - 기사님 (技士 – kỹ sĩ) – cách gọi lịch sự tài xế, nhân viên giao hàng (택배 기사); không phải "kỹ sư"; khác 기사 (記事 – ký sự) – bài báo
  - 헷갈리다 – nhầm lẫn, lẫn lộn
  - -(으)시기 바랍니다 – mong quý vị vui lòng …; lời đề nghị trang trọng hay dùng trong thông báo
