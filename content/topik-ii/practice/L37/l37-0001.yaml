notes_internal: "Cặp với l38-0001: transcript_ko/transcript_vi, speakers, tts_notes chép nguyên văn từ l38-0001. Căn cứ của L37 là câu kết của chuyên gia ('기기에 기대기 전에 … 건물의 구조만으로 햇빛과 비를 다스리는 방법을 먼저 고민해 볼 필요가 있습니다'), khác căn cứ của L38 (mái hiên che mưa cho cột gỗ). Không có phương án nào nhắc tới mưa hay cột gỗ, để không làm lộ đáp án L38. Nhiễu ④ ('điều tiết lượng nắng theo mùa') đúng theo bài nhưng chỉ là phần giải thích, và không khẳng định chi tiết mùa đông nên không làm lộ nhiễu ① của L38. Độ khó 5 theo bảng."
