notes_internal: |
  Số liệu hoàn toàn giả định (data_is_fictional: true), không lấy từ thống kê thật của thành phố hay thư viện nào; cơ quan ghi △△시.
  Kiểu đề (b) so sánh hai nhóm theo thời gian + (c) lý do khảo sát. Khác chủ đề và khác cấu trúc với w53-0001 (một chuỗi xu hướng + lý do + triển vọng).
  Đề không có khối "전망" nên bài mẫu không viết triển vọng; người học không bị trừ điểm vì thiếu dự báo.
  Bẫy đọc số liệu có chủ đích: điện tử tăng mạnh nhưng năm 2024 vẫn ít hơn giấy (60만 < 150만). Bài viết "전자책이 종이책보다 많아졌다" là sai số liệu.
  Reviewer lưu ý: người soạn không nhớ có đề NIIED W53 nào về "대출 건수 종이책/전자책 ở thư viện công cộng"; nhờ đối chiếu thêm theo checklist F1.
