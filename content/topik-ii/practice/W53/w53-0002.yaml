model_answers:
  - level: 4
    char_count: 263
    covers: [p1, p2, p3]
    text: |
      △△시 공공도서관의 도서 대출 현황을 조사한 결과, 종이책과 전자책은 서로 다른 변화를 보였다. 종이책 대출은 2016년 210만 건에서 2020년 180만 건, 2024년 150만 건으로 꾸준히 감소하였다. 반면 전자책 대출은 같은 기간 15만 건에서 35만 건, 60만 건으로 크게 증가하였다. 전자책을 이용하는 이유로는 '시간과 장소의 제약이 없다'가 46%로 가장 많았고, '휴대가 간편하다'가 32%, '글자 크기를 조절할 수 있다'가 22%로 그 뒤를 이었다.
    rubric_notes_vi:
      task_fulfillment: "Đủ cả 3 ý bắt buộc, mọi số liệu khớp chart_data (210/180/150만 건; 15/35/60만 건; 46/32/22%). Không thêm ý kiến cá nhân, không viết tiêu đề. Dùng '같은 기간' để khỏi lặp lại các năm ở dòng sách điện tử mà vẫn rõ mốc."
      organization: "Một đoạn 4 câu theo trình tự: câu tổng quát (hai loại sách thay đổi khác nhau) → sách giấy → sách điện tử → lý do. Từ nối 반면 đánh dấu quan hệ đối lập giữa p1 và p2."
      language_use: "Đúng văn phong -ㄴ다/-다 từ đầu đến cuối. Biểu hiện chuẩn cấp 4: -을 조사한 결과, -에서 -(으)로 감소하였다, 반면, 가장 많았고, 그 뒤를 이었다. Câu đúng nhưng cấu trúc còn lặp (hai câu xu hướng cùng khuôn -에서 -(으)로), chưa có biểu hiện diễn giải mức độ thay đổi."
  - level: 5
    char_count: 287
    covers: [p1, p2, p3]
    text: |
      △△시 공공도서관의 대출 현황을 살펴보면 종이책과 전자책이 상반된 흐름을 보인다. 종이책 대출은 2016년 210만 건에서 2020년 180만 건, 2024년 150만 건으로 감소세가 이어졌다. 이에 비해 전자책 대출은 2016년 15만 건에 그쳤으나 2020년 35만 건을 거쳐 2024년에는 60만 건을 기록하며 4배로 증가하였다. 전자책을 이용하는 이유로는 '시간과 장소의 제약이 없다'는 응답이 46%로 가장 높았으며, '휴대가 간편하다'(32%), '글자 크기를 조절할 수 있다'(22%)가 뒤를 이었다.
    rubric_notes_vi:
      task_fulfillment: "Đủ 3 ý, số liệu đúng. Có thêm phần diễn giải dựa đúng trên số liệu: '4배로 증가하였다' (15만 → 60만 là gấp 4). Không suy diễn vượt dữ liệu (không nói sách điện tử đã vượt sách giấy)."
      organization: "Câu mở khái quát bằng một danh từ trừu tượng (상반된 흐름) rồi mới đi vào chi tiết, giúp người chấm thấy ngay trục so sánh. 이에 비해 nối hai xu hướng; câu cuối gom 3 lý do trong một câu nhờ ngoặc đơn (%), gọn hơn bài cấp 4."
      language_use: "Đa dạng hơn bài cấp 4: -을 살펴보면, 상반되다, danh từ hoá 감소세가 이어지다, -에 그쳤으나, -을 거쳐, -을 기록하며, -배로 증가하다, 응답이 … 가장 높았으며. Không lặp khuôn câu giữa hai dòng xu hướng. Văn phong -ㄴ다/-다 nhất quán."
