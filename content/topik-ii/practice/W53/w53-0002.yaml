scoring_notes_vi: |
  Tiêu chí 내용 및 과제 수행: mức cao khi đủ p1–p3, nhắc đủ 3 mốc của cả hai loại sách và đủ 3 lý do kèm %, số liệu không sai. Bị hạ mạnh khi bỏ hẳn một loại sách, bỏ phần lý do, sai số (đặc biệt sai đơn vị 만 건), hoặc kết luận sai dữ liệu như "전자책이 종이책보다 많아졌다".
  Tiêu chí 글의 전개 구조: mức cao khi viết thành một đoạn liền mạch có câu mở khái quát, có từ nối đối lập (반면, 이에 비해) giữa hai xu hướng và chuyển ý rõ sang phần lý do. Bị hạ khi chỉ liệt kê số theo dòng, không có liên kết, hoặc tách thành nhiều đoạn rời.
  Tiêu chí 언어 사용: mức cao khi văn phong -ㄴ다/-다 nhất quán, dùng đúng và đa dạng biểu hiện mô tả số liệu, 띄어쓰기 đúng, cách viết đơn vị thống nhất. Bị hạ mạnh khi dùng -요/-습니다, dùng khẩu ngữ (너무, 진짜), hoặc nhiều lỗi ngữ pháp gây khó hiểu.
  Lỗi hình thức: dưới 200 ký tự, viết tiêu đề, thêm ý kiến cá nhân, chép nguyên các dòng dữ liệu có mũi tên mà không chuyển thành câu.
common_mistakes_vi:
  - "Đọc sai trục so sánh: viết '전자책이 종이책보다 많아졌다'. Sách điện tử tăng mạnh nhưng năm 2024 vẫn ít hơn sách giấy (60만 건 so với 150만 건)."
  - "Nhầm đơn vị 만: 210만 건 là 2,1 triệu lượt. Người học hay đổi sang cách đếm tiếng Việt rồi viết sai thành '21만 건' hoặc '2100만 건'."
  - "Chuẩn 맞춤법 cho phép cả '210만 건' lẫn '210만건' (đơn vị sau chữ số Ả Rập được viết liền). Nên chọn một cách và dùng thống nhất cả bài; bài mẫu viết cách."
  - "Dùng '4배 증가하였다' trong khi muốn nói 'tăng lên gấp 4'. Viết '4배로 증가하였다' / '4배로 늘었다' thì rõ nghĩa hơn; tránh nói '4배 이상'."
  - "Trong văn mô tả số liệu nên ưu tiên 감소하다/줄어들다; 떨어지다 không sai nhưng tự nhiên hơn với tỉ lệ, giá, điểm số."
  - "Chỉ mô tả hai đường mà bỏ phần lý do, hoặc chỉ nêu lý do cao nhất (46%) rồi bỏ hai lý do còn lại."
  - "Thêm cảm nghĩ: '나는 종이책이 더 좋다고 생각한다', '도서관은 전자책을 더 많이 사야 한다'. W53 không hỏi ý kiến hay đề xuất."
  - "Chép nhãn dữ liệu nguyên dạng danh từ: '시간·장소의 제약이 없음이 46%이다'. Nên chuyển thành mệnh đề trích dẫn: '시간과 장소의 제약이 없다'가 / '…없다'는 응답이."
explanation_vi: |
  **Phân tích đề:** Đề có 2 khối dữ liệu: (1) hai đường xu hướng ngược chiều nhau (sách giấy giảm, sách điện tử tăng) trong cùng giai đoạn 2016–2024; (2) biểu đồ tròn về lý do dùng sách điện tử. Đây là kiểu **so sánh hai nhóm + lý do**, trọng tâm là biểu hiện **đối lập** giữa hai đường. Đề không có khối "전망" nên **không cần** viết dự báo.

  **Dàn ý:** 4 câu, viết thành một đoạn.
  1. Câu mở khái quát: giới thiệu dữ liệu và nêu ngay trục so sánh (종이책과 전자책은 서로 다른 변화를 보였다 / 상반된 흐름이 나타난다).
  2. Sách giấy (p1): đủ 3 mốc, động từ giảm (감소하였다, 줄어들었다).
  3. Sách điện tử (p2): mở bằng 반면 / 이에 비해, đủ 3 mốc; có thể thêm diễn giải mức độ đúng số liệu (4배로 증가하였다).
  4. Lý do (p3): 3 lý do theo thứ tự lớn → nhỏ: 가장 많았고 … 그 뒤를 이었다.

  **Lưu ý:**
  - Cẩn thận số liệu: sách điện tử tăng gấp 4 nhưng vẫn ít hơn sách giấy. Chỉ viết điều dữ liệu cho thấy, không kết luận "sách điện tử đã thay thế sách giấy".
  - Chuyển nhãn thành câu: nhãn dạng danh từ hoá (-음, 가능) cần đổi thành mệnh đề: '시간과 장소의 제약이 없다'는 응답이 46%로 가장 높았다.

  **Đáng chú ý:**
  - 대출 (貸出 – thải xuất) – cho mượn; ở đây là lượt mượn sách của thư viện
  - 건 (件 – kiện) – lượt, vụ (danh từ đơn vị đếm sự việc)
  - 제약 (制約 – chế ước) – hạn chế, ràng buộc
  - 상반되다 (相反 – tương phản) – trái ngược nhau
  - 감소세 (減少勢 – giảm thiểu thế) – đà giảm
