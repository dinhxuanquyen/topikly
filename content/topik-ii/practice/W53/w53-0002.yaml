stem: "다음은 '△△시 공공도서관의 도서 대출 현황'에 대한 자료이다. 이 내용을 200~300자의 글로 설명하십시오. 단, 글의 제목을 쓰지 마십시오."
task: |
  자료: △△시 (공공도서관 12곳 통계)
  [연도별 대출 건수]
  · 종이책: 2016년 210만 건 → 2020년 180만 건 → 2024년 150만 건
  · 전자책: 2016년 15만 건 → 2020년 35만 건 → 2024년 60만 건
  [전자책 이용 이유] (조사 대상: 전자책 이용자 800명)
  · 시간·장소의 제약이 없음 46%
  · 휴대가 간편함 32%
  · 글자 크기 조절 가능 22%
data_is_fictional: true
image_desc: "Khung trên: biểu đồ đường tiêu đề '연도별 대출 건수 (단위: 만 건)', trục hoành 3 mốc 2016, 2020, 2024; hai đường: '종이책' (210 → 180 → 150, đi xuống) và '전자책' (15 → 35 → 60, đi lên), ghi số trên từng điểm, hai đường không cắt nhau. Khung dưới: biểu đồ tròn tiêu đề '전자책 이용 이유', ghi chú nhỏ '전자책 이용자 800명 대상', ba phần: '시간·장소의 제약이 없음 46%', '휴대가 간편함 32%', '글자 크기 조절 가능 22%'. Góc dưới phải ghi '자료: △△시'. Mọi nhãn trong hình bằng tiếng Hàn."
