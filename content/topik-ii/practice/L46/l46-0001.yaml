notes_internal: "l45-0001 chưa soạn. Gợi ý cho L45 (trùng khớp): đáp án kiểu ''다리'는 처음에는 사람이나 짐승의 몸에만 쓰였다' hoặc ''어린 백성'은 원래 글을 모르는 백성을 가리켰다'; tránh hỏi lại cách phân loại ba kiểu (đó là căn cứ của L46). Kiến thức cần reviewer xác nhận: '어리다' trung đại = '어리석다' (ví dụ '어린 百姓' trong lời tựa Huấn dân chính âm, kiểu 의미의 이동); '얼굴' trung đại = 모습/형체 (의미의 축소); '다리' mở rộng sang đồ vật (의미의 확대) — đều là ví dụ quen thuộc trong sách giáo khoa quốc ngữ Hàn. Thứ tự câu hỏi trong cặp L45–46 và giới tính người giảng còn [cần đối chiếu] (Phụ lục A6). Transcript khoảng 545 ký tự (không tính nhãn), đếm tay. Giữ difficulty 6 (sau lượt duyệt 2026-10-20): đáp án ② có tín hiệu cấu trúc rõ, nhưng hai nhiễu ① (절충) và ④ (촉구 giữ nghĩa gốc) cùng bám vào quan điểm '말이 타락한다' có thật trong bài. Thí sinh phải phân biệt được quan điểm được trích dẫn với lập trường của người giảng (phản bác bằng 하지만, không dung hoà). Từ khoá nhiễu 상반된, 절충하다, 촉구하다 ở mức cấp 6. Đạt điều kiện nhãn 6 của spec v0.2 (ghi chú dưới bảng 3.1). Theo §2.2 v0.2, trap của ④ đổi từ speaker_swap sang concession_point."
