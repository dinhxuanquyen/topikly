notes_internal: "2026-10-26: l25-0001 đã soạn (dùng trong Mini test Nghe 01), chỉ sửa notes_internal ở file này. Gợi ý ban đầu cho L25 (중심 생각 của 남자): 'Giúp người dân tự sửa xe quan trọng hơn sửa hộ'. Đáp án L26 (lý do người dân bỏ đi xe) là chi tiết bối cảnh, không trùng ý chính. Transcript khoảng 345 ký tự (không tính nhãn), đếm tay. Hoạt động sửa xe đạp hư cấu, không gắn với tổ chức có thật."
