notes_internal: "Cặp với l26-0001: transcript_ko/transcript_vi, speakers, tts_notes chép nguyên văn từ l26-0001. Căn cứ của L25 là câu '고쳐 드리는 것보다 고치는 방법을 알려 드리는 게 더 중요하더라고요' và cách làm hiện nay của ông; khác căn cứ của L26 (lý do người dân bỏ đi xe vì tiệm sửa xa). Các phương án không nhắc tới tiệm sửa xa, việc nghỉ hưu hay tiền phụ tùng, để không làm lộ đáp án ④ và các nhiễu ①③ của L26. Độ khó 4 theo bảng. 2026-10-26 (chỉ metadata, theo content-spec v0.3.5 §2.2 và mục Duyệt lại của content/_reviews/2026-10-26-mini-nghe-01.md): trap của ② đổi negation_flip → attitude_mismatch, vì '전문가에게 맡기는 것이 안전하다' là lập trường ngược với người nói trên cùng đối tượng, không phải đảo khẳng định ↔ phủ định. note_vi giữ nguyên. Câu có 3 kiểu bẫy."
