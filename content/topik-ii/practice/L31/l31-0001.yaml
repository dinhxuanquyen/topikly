tts_notes:
  speed: 1.0
  style_vi: "Tranh luận chính sách, văn nói trang trọng (-습니다) xen -거든요, -죠. Nam nói chậm, rõ ở câu có số liệu."
  pauses_vi: "Ngắt rõ trước '하지만' và trước '내보내자는 게 아닙니다.'"
  pronunciation_vi: "10명 중 8명 đọc là 열 명 중 여덟 명; 독서실 [독써실]; 열람실 đọc rõ ㄹㄹ; 없애자는 [업쌔자는]; 일부를 줄이자는 nhấn nhẹ."
transcript_ko: |
  여자: 공공 도서관 열람실을 줄이는 데에는 반대합니다. 독서실이나 스터디 카페에 다닐 형편이 안 되는 학생들한테는 도서관 열람실이 사실상 유일하게 마음 놓고 공부할 수 있는 곳이거든요.
  남자: 그런 학생들이 있다는 건 저도 잘 압니다. 하지만 지난해 한 구립 도서관의 이용 실태를 조사한 결과를 보면, 열람실 이용자 10명 중 8명은 도서관 책을 한 권도 빌리지 않았습니다. 도서관이 책을 읽고 정보를 얻는 곳이 아니라 개인 공부방이 되어 버린 거죠. 공간은 한정되어 있는데 정작 책을 보러 온 아이들과 주민들은 앉을 자리가 없습니다.
  여자: 그렇다고 공부할 곳이 필요한 사람들을 내보내는 게 맞을까요?
  남자: 내보내자는 게 아닙니다. 열람실을 완전히 없애자는 게 아니라 일부를 줄이자는 겁니다. 도서관의 공간과 예산은 무엇보다 책과 독서를 위해 쓰여야 합니다. 공부할 곳이 부족한 학생들을 위해서는 주민센터의 빈 공간을 활용하는 방법도 얼마든지 있고요.
transcript_vi: |
  Nữ: Tôi phản đối việc thu hẹp phòng đọc của thư viện công cộng. Bởi vì với những học sinh không có điều kiện đến phòng tự học thuê theo giờ hay quán cà phê học tập, phòng đọc của thư viện gần như là nơi duy nhất các em có thể yên tâm ngồi học.
  Nam: Tôi cũng biết rõ là có những học sinh như vậy. Nhưng theo kết quả khảo sát thực trạng sử dụng của một thư viện quận năm ngoái, cứ 10 người dùng phòng đọc thì có 8 người không mượn một cuốn sách nào của thư viện. Tức là thư viện đã biến thành phòng học cá nhân chứ không còn là nơi đọc sách và tìm thông tin nữa. Không gian thì có hạn, trong khi chính trẻ em và người dân đến để đọc sách lại không có chỗ ngồi.
  Nữ: Dù vậy, đuổi những người cần chỗ học đi thì có đúng không?
  Nam: Không phải là đuổi họ đi. Ý tôi không phải là bỏ hẳn phòng đọc mà là thu hẹp một phần. Không gian và ngân sách của thư viện trước hết phải được dùng cho sách và việc đọc. Còn với học sinh thiếu chỗ học thì cũng có rất nhiều cách, chẳng hạn tận dụng không gian trống ở trung tâm dân cư phường.
stem: "남자의 중심 생각으로 가장 알맞은 것을 고르십시오."
choices:
  - label: "①"
    text: 도서관 공간은 본래 목적에 맞게 써야 한다.
    correct: true
  - label: "②"
    text: 도서관 열람실은 모두 없애는 것이 좋다.
    trap: degree_shift
    note_vi: "Sai phạm vi: nam nói rõ '완전히 없애자는 게 아니라 일부를 줄이자는 겁니다' (không phải bỏ hẳn mà chỉ thu hẹp một phần)."
  - label: "③"
    text: 열람실은 학생들에게 꼭 필요한 공간이다.
    trap: speaker_swap
    note_vi: "Đây là lập luận của nữ (사실상 유일하게 마음 놓고 공부할 수 있는 곳). Nam chỉ thừa nhận có những học sinh như vậy (그런 학생들이 있다는 건 저도 잘 압니다) rồi phản bác bằng '하지만'."
  - label: "④"
    text: 주민센터를 학생 공부 공간으로 활용해야 한다.
    trap: true_not_main
    note_vi: "Nam có nhắc tới trung tâm dân cư (주민센터), nhưng chỉ như một giải pháp phụ cho học sinh (방법도 얼마든지 있고요), không phải quan điểm trung tâm của anh trong cuộc tranh luận."
explanation_vi: |
  **Đáp án ①.** Căn cứ: "도서관의 공간과 예산은 무엇보다 책과 독서를 위해 쓰여야 합니다" (không gian và ngân sách thư viện trước hết phải được dùng cho sách và việc đọc), cùng lời phê phán "도서관이 책을 읽고 정보를 얻는 곳이 아니라 개인 공부방이 되어 버린 거죠" (thư viện đã thành phòng học cá nhân chứ không còn là nơi đọc sách, tìm thông tin).
  Nam cho rằng thư viện phải được dùng đúng chức năng vốn có (đọc sách, tìm thông tin). Đáp án gói hai câu này lại thành "본래 목적에 맞게 써야 한다".
  **Mẹo dạng:** Trong tranh luận, ý chính thường nằm ở câu -아/어야 하다 đứng sau 하지만, 무엇보다. Câu nhượng bộ (… 저도 잘 압니다) và giải pháp phụ ở cuối lượt không phải ý chính.
  **Đáng chú ý:** 형편 (形便 – hình tiện) – hoàn cảnh, điều kiện (thường là kinh tế), 형편이 안 되다: không có điều kiện; 실태 (實態 – thực thái) – thực trạng; 정작 – trong khi chính (người/việc cần đến) lại….
