notes_internal: "r46-0001 (thái độ tác giả) chưa soạn. Lập trường tác giả dự kiến cho R46: ủng hộ và thúc giục sớm đưa ra chế độ 'quyền được sửa chữa'. Đáp án R47 là chi tiết về lo ngại của nhà sản xuất, không làm lộ đáp án R46. Kiến thức: một số nước/khu vực đã ban hành quy định 'right to repair' (bắt buộc cung cấp linh kiện, tài liệu sửa chữa); bài chỉ nói '일부 국가' chung chung, nhờ reviewer xác nhận. Khi soạn r46-0001 phải chép nguyên văn passage này. 2026-10-20: sửa passage ('이 제도에 대해 우려를 표한다', '수리 업체' viết cách) và cập nhật trích dẫn trong note_vi ①, explanation_vi theo gợi ý duyệt. Lưu ý góp ý spec số 9: nếu đối chiếu cho thấy câu 46 là câu chèn <보기> thì passage chung r46-47-0001 phải thêm vị trí ㉠–㉣, khi đó sửa cả file này. Reviewer nhận xét nhiễu hơi dễ so với mức 6; giữ difficulty 6 (trong biên ±1). 2026-10-20 (spec v0.2, chỉ định dạng): bỏ dòng trống giữa 2 đoạn theo quy ước ngăn đoạn §5.2 (mỗi dòng một đoạn); không đổi chữ nào. r46-0001 phải chép đúng passage ở định dạng này."
passage: |
  스마트폰의 배터리가 빨리 닳거나 화면에 금이 가면 많은 사람들은 수리보다 교체를 먼저 떠올린다. 수리비가 새 제품 가격과 크게 다르지 않은 데다가 제조사의 공식 서비스 센터가 아니면 부품을 구하기조차 어렵기 때문이다. 이러한 문제를 해결하기 위해 최근 일부 국가에서는 제조사가 일정 기간 부품을 공급하고 수리 설명서를 소비자와 수리 업체에 공개하도록 하는 이른바 '수리할 권리' 제도를 도입하고 있다.
  제조사들은 이 제도에 대해 우려를 표한다. 전문 지식이 없는 사람이 기기를 분해하면 오히려 고장이 커지거나 안전사고가 날 수 있고, 제품 설계에 담긴 기술이 외부로 새어 나갈 수도 있다는 것이다. 물론 이러한 지적은 가볍게 넘길 일이 아니다. 그러나 이는 수리 자격 기준을 마련하고 공개할 정보의 범위를 정하는 방식으로 충분히 보완할 수 있는 문제이다. 위험이 있다는 이유만으로 소비자가 자기 물건을 고쳐 쓸 길을 막는 것은 지나치다. 더 중요한 것은 제품의 수명이 곧 자원의 문제라는 점이다. 부품 하나 때문에 멀쩡한 기기가 버려질 때마다 그 기기를 만드는 데 쓰인 금속과 에너지도 함께 헛되이 사라진다. 수리할 권리는 단순히 소비자의 편의를 위한 제도가 아니라 자원 낭비를 줄이기 위한 최소한의 장치인 셈이다. 우리도 하루빨리 관련 제도를 마련해야 한다.
stem: "위 글의 내용과 같은 것을 고르십시오."
choices:
  - label: "①"
    text: "수리할 권리 제도는 수리 설명서를 공식 업체에만 공개하도록 한다."
    trap: detail_swap
    note_vi: "Bài viết nói tài liệu sửa chữa được công khai cho cả người tiêu dùng và cơ sở sửa chữa (소비자와 수리 업체에 공개하도록), không giới hạn ở đơn vị chính hãng. Việc chỉ trung tâm chính hãng mới có linh kiện là vấn đề mà chế độ này muốn giải quyết."
  - label: "②"
    text: "필자는 수리 자격 기준을 마련해도 안전 문제는 해결되기 어렵다고 본다."
    trap: negation_flip
    note_vi: "Ngược ý tác giả: tác giả cho rằng lo ngại về an toàn là vấn đề có thể khắc phục đầy đủ bằng tiêu chuẩn tư cách sửa chữa (충분히 보완할 수 있는 문제이다)."
  - label: "③"
    text: "수리할 권리 제도가 도입된 뒤 수리비가 새 제품 가격만큼 올랐다."
    trap: reverse_causality
    note_vi: "Đảo nhân quả: chi phí sửa gần bằng giá máy mới là lý do khiến chế độ này ra đời, không phải hậu quả sau khi áp dụng. Bài cũng không nói chi phí sửa tăng lên."
  - label: "④"
    text: "제조사들은 제품 기술이 외부에 알려질 가능성을 걱정하고 있다."
    correct: true
explanation_vi: |
  **Đáp án ④.** Căn cứ: "제조사들은 이 제도에 대해 우려를 표한다. … 제품 설계에 담긴 기술이 외부로 새어 나갈 수도 있다는 것이다" (các nhà sản xuất bày tỏ lo ngại về chế độ này… rằng công nghệ nằm trong thiết kế sản phẩm có thể bị lọt ra ngoài). ④ diễn đạt lại "기술이 외부로 새어 나가다" thành "기술이 외부에 알려지다", và "우려를 표하다" thành "걱정하다".
  **Mẹo dạng:** với bài nghị luận dài, tách rõ ý của **tác giả** và ý của **bên được dẫn lại** (제조사들은 … -다는 것이다). Phương án nhiễu hay gán nhầm ý của bên này cho bên kia, hoặc biến nguyên nhân ra đời của một chính sách thành hậu quả của nó.
  **Đáng chú ý:** 분해하다 (分解 – phân giải) – ở đây là tháo rời (máy móc). Cũng có nghĩa 'phân huỷ' giống 'phân giải' trong tiếng Việt (vi sinh vật phân giải chất hữu cơ), nhưng không có nghĩa 'độ phân giải' (해상도) hay 'phân xử' · 보완하다 (補完 – bổ hoàn) – bổ sung cho hoàn chỉnh, khắc phục · -(으)ㄴ 셈이다 – coi như là, rốt cuộc là.
