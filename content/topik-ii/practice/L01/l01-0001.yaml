notes_internal: "Độ dài transcript ước tính khoảng 90 ký tự (không tính nhãn người nói), đếm tay vì chưa có script. Tranh ③ và ④ chỉ khác chiều trao chiếc cúc, hoạ sĩ cần vẽ rõ bàn tay nào chìa ra, bàn tay nào ngửa ra đón."
