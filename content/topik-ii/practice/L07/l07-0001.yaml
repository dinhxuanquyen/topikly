notes_internal: "Transcript khoảng 80 ký tự (không tính nhãn), đếm tay. Bối cảnh tiệm bánh (setting:store). Lượt cuối của người A (nữ, khách) là câu hỏi xin giải pháp; người học chọn lời của người B (nam, nhân viên). Đã đọc nối từng phương án vào sau lượt cuối: chỉ ① vừa trả lời câu hỏi 'phải làm sao' vừa giải quyết đúng vấn đề kem chảy. Không đưa phương án 'đổi sang bánh không có kem tươi' hay 'ăn tại tiệm' vì đó cũng là giải pháp hợp lý, sẽ thành hai đáp án đúng."
