notes_internal: "Số liệu giả định. Mỗi nhóm cộng đủ 100%. Phương án ④ cố ý dùng hai hạng mục chênh 1 điểm (운동 27% / 취미 활동 26%) để kiểm tra đọc kỹ. 2026-10-20: đổi lệnh đề sang lệnh nhóm 9–12 '다음 글 또는 그래프의 내용과 같은 것을 고르십시오.' [cần đối chiếu topik.go.kr]; sửa mục 'Đáng chú ý' (다음으로, 계발/개발) theo gợi ý duyệt. 2026-10-20 (spec v0.2): bỏ passage (lặp tiêu đề biểu đồ); chuyển dòng nguồn/đối tượng sang chart_data[0].caption; chart_data đổi thành list một phần tử; image_desc sửa vị trí chú thích (dưới tiêu đề) cho khớp caption. unit '%' và y theo % đúng định nghĩa mới; hai series cùng tập x và cùng thứ tự x."
image_desc: "Biểu đồ cột nhóm (grouped bar). Tiêu đề '퇴근 후 가장 많이 하는 활동', ngay dưới tiêu đề là dòng chú thích nhỏ '○○연구소, 20대·40대 직장인 각 500명 대상'. Trục hoành 4 hạng mục theo thứ tự: 휴식, 자기 계발, 취미 활동, 운동. Mỗi hạng mục có 2 cột: 20대 (màu xanh dương) và 40대 (màu cam), số % ghi trên đầu cột. 20대: 31, 29, 22, 18. 40대: 35, 12, 26, 27. Nhãn '단위: %' ở góc trên phải. Mọi nhãn bằng tiếng Hàn."
