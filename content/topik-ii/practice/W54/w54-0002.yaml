stem: "다음을 주제로 하여 자신의 생각을 600~700자로 글을 쓰십시오. 단, 문제를 그대로 옮겨 쓰지 마십시오."
task: |
  요즘은 기다리는 시간을 줄여 주는 서비스가 빠르게 늘고 있다. 사람들은 점점 기다림을 견디기 어려워하고 무엇이든 빨리 얻기를 원한다. 그러나 속도만을 좇다 보면 잃는 것도 생기기 마련이다. 아래의 내용을 중심으로 '속도를 중시하는 사회와 기다림의 가치'에 대한 자신의 생각을 쓰라.
  · 현대 사회가 속도를 중시하게 된 이유는 무엇인가?
  · 속도를 중시하는 문화의 긍정적인 면과 부정적인 면은 무엇인가?
  · 기다림의 가치를 지키기 위해 어떤 노력이 필요한가?
required_points:
  - { id: p1, ko: "현대 사회가 속도를 중시하게 된 이유", vi: "Lý do xã hội hiện đại coi trọng tốc độ (nên nêu ít nhất 1–2 nguyên nhân có giải thích)" }
  - { id: p2, ko: "속도 중시 문화의 긍정적인 면과 부정적인 면", vi: "Cả mặt tích cực LẪN mặt tiêu cực; thiếu một mặt là chưa hoàn thành câu hỏi" }
  - { id: p3, ko: "기다림의 가치를 지키기 위한 노력", vi: "Nỗ lực cần thiết để giữ giá trị của sự chờ đợi (cụ thể, có chủ thể: cá nhân, xã hội…)" }
char_limit: { min: 600, max: 700 }
model_answers:
  - level: 5
    char_count: 642
    covers: [p1, p2, p3]
    text: |
      오늘날 많은 사람들은 주문한 물건이 다음 날 도착하고 보낸 메시지에 곧바로 답장이 오는 것을 당연하게 여긴다. 이처럼 현대 사회는 무엇이든 빠르게 처리하는 것을 중요하게 생각한다. 이 글에서는 속도를 중시하는 문화의 원인과 영향을 살펴보고, 기다림의 가치를 지키는 방법을 생각해 보고자 한다.
      속도를 중시하게 된 가장 큰 이유는 기술의 발달이다. 인터넷과 스마트폰이 보급되면서 정보를 찾거나 물건을 사는 데 걸리는 시간이 크게 줄었다. 또한 경쟁이 치열한 사회에서는 남보다 빨리 결과를 내는 사람이 유리하기 때문에 사람들은 시간을 아끼는 것을 능력으로 여기게 되었다.
      물론 속도를 중시하는 문화에는 긍정적인 면도 있다. 일을 빠르게 처리할 수 있어 생활이 편리해지고, 남는 시간을 다른 일에 쓸 수 있다. 그러나 빠른 것에 익숙해지면 조금만 기다려도 참지 못하게 된다. 게다가 결과를 서두르다 보면 충분히 생각하지 않고 결정을 내리거나 실수를 하기 쉽다.
      따라서 기다림의 가치를 지키기 위해서는 개인과 사회가 함께 노력해야 한다. 개인은 책을 천천히 읽거나 손으로 편지를 쓰는 등 일부러 느린 경험을 해 보는 것이 좋다. 사회는 결과뿐만 아니라 과정도 인정하는 분위기를 만들어야 한다. 빠름과 느림이 균형을 이룰 때 우리의 삶은 더욱 여유로워질 것이다.
    rubric_notes_vi:
      task_fulfillment: "Trả lời đủ 3 câu hỏi theo đúng thứ tự: p1 hai nguyên nhân (công nghệ phát triển; cạnh tranh khiến tiết kiệm thời gian được coi là năng lực); p2 có cả mặt tích cực (tiện lợi, dư thời gian) và hai mặt tiêu cực (mất kiên nhẫn, quyết định vội); p3 nỗ lực của cá nhân và của xã hội, mỗi bên một việc cụ thể. Lập trường nhất quán: thừa nhận lợi ích nhưng nhấn mạnh cần cân bằng."
      organization: "4 đoạn rõ ràng: 서론 (tình huống quen thuộc → khái quát → nêu hướng bài viết) – 본론 1 (p1) – 본론 2 (p2) – 결론 kiêm p3. Mỗi đoạn mở bằng câu chủ đề. Từ nối đánh dấu đúng quan hệ: 이처럼 (khái quát), 또한 (bổ sung), 물론 … 그러나 (nhượng bộ – đối lập), 게다가 (bổ sung), 따라서 (kết luận)."
      language_use: "Văn phong -ㄴ다/-다 nhất quán, không có -요/-습니다. Ngữ pháp cấp 5 dùng đúng: -(으)면서, -는 데 걸리는 시간, -기 때문에, -게 되다, -다 보면, -기 쉽다, -기 위해서는 -아야 한다, -뿐만 아니라. Từ vựng chính xác nhưng phần lớn ở mức trung cấp (편리하다, 유리하다, 균형); câu dài vừa phải, ít danh từ trừu tượng."
  - level: 6
    char_count: 660
    covers: [p1, p2, p3]
    text: |
      주문한 물건이 몇 시간 만에 도착하고, 궁금한 것은 검색 한 번으로 바로 해결되는 시대가 되었다. 사람들은 기다리는 시간을 낭비로 여기고 무엇이든 즉시 얻기를 바란다. 그러나 속도가 삶의 질을 결정하는 유일한 기준은 아니라는 점에서 이러한 흐름을 되돌아볼 필요가 있다.
      사회가 속도를 중시하게 된 데에는 몇 가지 원인이 있다. 우선 정보 통신 기술의 발달로 시간과 거리의 제약이 크게 줄어들면서 빠른 서비스는 당연한 것이 되었다. 여기에 치열한 경쟁 구조가 더해져 얼마나 빨리 결과를 내느냐가 개인과 기업의 경쟁력을 가르는 기준이 되었다.
      물론 속도를 중시하는 문화가 삶을 편리하게 만든 것은 사실이다. 같은 시간에 더 많은 일을 처리할 수 있게 되었기 때문이다. 하지만 즉각적인 만족에 길들여질수록 작은 지연도 견디지 못하고, 깊이 생각하거나 관계를 천천히 쌓아 가는 일을 소홀히 하기 쉽다. 결국 편리함 뒤에는 인내심과 사고의 깊이를 잃는 대가가 따르는 셈이다.
      따라서 기다림의 가치를 지키기 위해서는 개인과 사회 모두의 노력이 필요하다. 개인은 디지털 기기를 내려놓고 산책이나 독서처럼 천천히 즐기는 시간을 의식적으로 마련해야 한다. 사회 역시 빠른 성과만을 보상하기보다 과정을 존중하는 문화를 만들어 가야 한다. 속도와 여유가 조화를 이룰 때 비로소 삶은 더 풍요로워질 것이다.
    rubric_notes_vi:
      task_fulfillment: "Đủ 3 câu hỏi và lập luận sâu hơn bài cấp 5: p1 không chỉ nêu nguyên nhân mà giải thích cơ chế (công nghệ xoá bỏ giới hạn thời gian, khoảng cách → tốc độ thành chuẩn mực; cạnh tranh → tốc độ thành thước đo năng lực); p2 đi tới hệ quả trừu tượng (mất kiên nhẫn, chiều sâu tư duy, quan hệ) và tổng kết bằng ý 'cái giá phải trả'; p3 có giải pháp cụ thể cho cá nhân và thay đổi cơ chế khen thưởng của xã hội."
      organization: "4 đoạn, 서론 nêu vấn đề bằng lập luận (-다는 점에서 … 필요가 있다) thay vì chỉ giới thiệu. Đoạn p1 dùng khung liệt kê 몇 가지 원인 → 우선 → 여기에 … 더해져. Đoạn p2 theo khung nhượng bộ 물론 … 사실이다 → 하지만 → 결국 … 셈이다, có câu tiểu kết. 결론 nối mạch bằng 따라서 và kết bằng 비로소, khép lại đúng chủ đề cân bằng tốc độ – thong thả."
      language_use: "Biểu hiện cấp 6 đa dạng và chính xác: -다는 점에서, -는 데에는 … 원인이 있다, -느냐가 … 기준이 되다, -(으)ㄹ수록, -는 셈이다, -기보다, -아 가다, 비로소. Từ vựng trừu tượng, học thuật: 즉각적, 지연, 길들여지다, 소홀히 하다, 대가, 의식적으로, 성과, 보상, 풍요롭다. Không lặp khuôn câu, văn phong -ㄴ다/-다 nhất quán."
