scoring_notes_vi: |
  Tiêu chí 내용 및 과제 수행: mức cao khi trả lời đủ 3 câu hỏi, câu hỏi 2 có **cả** mặt tích cực và tiêu cực, mỗi ý có giải thích hoặc ví dụ ngắn, lập trường nhất quán. Bị hạ mạnh khi thiếu một câu hỏi (thường là bỏ mặt tích cực), lạc sang chủ đề khác (chỉ bàn về điện thoại thông minh, nghiện mạng xã hội…), hoặc lập trường mâu thuẫn.
  Tiêu chí 글의 전개 구조: mức cao khi có 3–4 đoạn tương ứng 서론 – 본론 – 결론, mỗi đoạn có câu chủ đề, từ nối phù hợp quan hệ logic (물론 … 하지만, 또한, 따라서). Bị hạ khi viết một khối liền, đoạn kết chỉ lặp lại đoạn mở, hoặc ví dụ cá nhân dài lấn át lập luận.
  Tiêu chí 언어 사용: mức cao (cấp 6) khi dùng chính xác ngữ pháp và từ vựng trừu tượng, câu đa dạng, ít lỗi; mức cấp 5 khi đúng và đủ đa dạng nhưng từ vựng còn ở mức trung cấp. Bị hạ mạnh khi trộn -요/-습니다, dùng khẩu ngữ, nhiều lỗi 띄어쓰기 hoặc 번역투 gây khó hiểu.
  Lỗi hình thức: dưới 600 ký tự hoặc vượt 700 ký tự; chép nguyên đoạn dẫn hoặc chép câu hỏi gợi ý thành câu văn. Không cần viết tiêu đề (tốn ô 원고지, không được tính điểm nội dung).
common_mistakes_vi:
  - "Câu hỏi 2 chỉ viết mặt tiêu cực vì bị đoạn dẫn ('잃는 것도 생기기 마련이다') dẫn dắt. Đề hỏi cả 긍정적인 면 lẫn 부정적인 면."
  - "Chép câu hỏi gợi ý thành câu mở đoạn: '현대 사회가 속도를 중시하게 된 이유는 무엇인가? 그 이유는…'. Nên viết câu chủ đề bằng lời của mình, ví dụ '…된 데에는 몇 가지 원인이 있다'."
  - "Trộn -아요/-습니다 vào giữa bài, nhất là ở câu đề xuất ('노력해야 합니다')."
  - "Khẩu ngữ: '빨리빨리', '너무', '진짜'."
  - "Lạm dụng '-는 것 같다' (rào đón) khiến lập luận thiếu dứt khoát; nên dùng '-다고 본다', '-아야 한다'."
  - "Mở câu bằng 그래서/그리고 liên tục như văn nói. Trong văn nghị luận nên dùng 따라서, 또한, 게다가, 이처럼."
  - "번역투 từ tiếng Việt: 'tốc độ có vai trò quan trọng' dịch thành '속도는 중요한 역할을 가지고 있다'. Tự nhiên hơn: '속도가 중요한 역할을 한다'."
  - "Câu hỏi 3 chỉ viết khẩu hiệu chung chung ('모두 노력해야 한다') mà không nói ai làm gì."
  - "Kể kỷ niệm cá nhân quá dài (một lần chờ giao hàng…) làm hết chỗ cho câu hỏi 2 và 3, hoặc vượt 700 ký tự."
explanation_vi: |
  **Phân tích đề.** Đoạn dẫn nêu hiện tượng (dịch vụ rút ngắn thời gian chờ tăng, con người kém kiên nhẫn) và gợi ý vấn đề (chạy theo tốc độ thì đánh mất điều gì đó). Đề có 3 câu hỏi: **nguyên nhân** – **hai mặt** – **giải pháp**. Câu hỏi 2 là bẫy: phải viết cả mặt tích cực rồi mới chuyển sang tiêu cực.

  **Dàn ý 4 đoạn (khoảng 150 / 150 / 180 / 170 ký tự):**
  1. 서론: một tình huống quen thuộc (giao hàng, tin nhắn, tìm kiếm) → khái quát thành đặc điểm xã hội → nêu hướng bài viết hoặc nêu vấn đề.
  2. 본론 1 (p1): câu chủ đề "…된 데에는 몇 가지 원인이 있다" → nguyên nhân 1: công nghệ (인터넷, 스마트폰, 정보 통신 기술) → nguyên nhân 2: cạnh tranh, tốc độ thành thước đo năng lực.
  3. 본론 2 (p2): 물론 + mặt tích cực (tiện lợi, hiệu quả) → 하지만 + mặt tiêu cực (mất kiên nhẫn, quyết định vội, thiếu chiều sâu) → câu tiểu kết.
  4. 결론 (p3): 따라서 + nỗ lực của cá nhân (một hành động cụ thể) và của xã hội (thay đổi cách đánh giá) → câu kết về sự cân bằng.

  **Giữ lập trường:** không cần phản đối tốc độ. Lập trường an toàn và thuyết phục là "tốc độ có ích nhưng cần cân bằng với sự chờ đợi". Đoạn kết phải khớp lập trường đó.

  **Mẹo phân bổ ký tự:** viết xong mỗi đoạn thì ước lượng độ dài. Nếu đoạn 1 đã quá 180 ký tự, rút ngắn ví dụ mở bài để dành chỗ cho câu hỏi 2 (phần dài nhất). Bài mẫu cấp 6 (660 ký tự) đã dùng gần hết khung 원고지 vì mỗi đoạn còn thêm 1 ô thụt đầu dòng; khi thi giấy nên nhắm khoảng 620–660 ký tự.

  **Dùng lại từ khoá của đề:** được dùng lại từ khoá của câu hỏi gợi ý làm câu chủ đề (ví dụ "속도를 중시하게 된 데에는…"), nhưng không chép nguyên câu hỏi hay đoạn dẫn.

  **Đáng chú ý:**
  - 중시하다 (重視 – trọng thị) – coi trọng, xem là quan trọng; khác "trọng thị" trong tiếng Việt (thái độ tôn trọng, tiếp đón trang trọng một người)
  - 즉각적 (卽刻的 – tức khắc đích) – tức thì, ngay lập tức
  - 지연 (遲延 – trì diên) – sự chậm trễ
  - 소홀히 하다 (疏忽 – sơ hốt) – xem nhẹ, lơ là
  - 대가 (代價 – đại giá) – cái giá phải trả; khác 대가 (大家 – đại gia) – bậc thầy trong một lĩnh vực, và khác "đại gia" (người giàu) trong tiếng Việt
  - 길들여지다 – bị quen dần, bị thuần hoá (ở đây: quen với sự thoả mãn tức thì)
  - -(으)ㄹ수록 – càng … càng …
  - -는 셈이다 – coi như là, rốt cuộc là
