notes_internal: "Tuỳ bút ngôi thứ nhất tự soạn 100%, không trích hay phỏng theo tác phẩm nào. Passage 3 đoạn, khoảng 535 ký tự (đếm tay, chưa tính thẻ <u>; nhờ validator đếm lại). Phần gạch chân thể hiện cảm xúc gián tiếp qua hành động (đọc đi đọc lại, quên cả ga cần xuống), không gọi tên cảm xúc. Cảm xúc duy nhất được gọi tên trong bài là '서운해하시더니' của người bố, ở đoạn 3 (sau phần gạch chân), dùng làm căn cứ cho bẫy speaker_swap ①. Bẫy: ① speaker_swap, ② keyword_echo (bám chi tiết 'đi quá ga'), ③ attitude_mismatch (sai cường độ). Cố ý không đưa 미안하다/죄송하다 vào phương án vì người 'tôi' cũng có thể áy náy (một tháng không gọi), dễ thành hai đáp án. Tin nhắn của bố không trích nguyên văn (chỉ thuật lại '띄어쓰기가 하나도 안 된') để passage không chứa lỗi chính tả cố ý. Đáp án ④ theo yêu cầu lắp đề doc-01 (luật nhãn). r24-0001 phải chép nguyên văn passage này."
passage: |
  아버지는 휴대 전화를 쓰신 지 10년이 넘었지만 전화를 걸고 받는 것 말고는 할 줄 아는 것이 거의 없으셨다. 문자 보내는 법을 몇 번이나 알려 드렸지만 아버지는 글씨가 작아서 안 보인다며 손을 내저으셨다. 그래서 집에 연락할 일이 있으면 늘 내가 먼저 전화를 드렸다.
  지난겨울에는 회사 일이 밀려 한 달 가까이 집에 전화를 드리지 못했다. 그러던 어느 날 밤, 야근을 마치고 집으로 가는 지하철 안에서 휴대 전화가 울렸다. 아버지에게서 온 문자였다. 띄어쓰기가 하나도 안 된 두 줄짜리 문자에는 밥은 잘 챙겨 먹는지, 감기에 걸리지는 않았는지 묻는 말이 적혀 있었다. 돋보기를 쓰고 한 글자씩 천천히 화면을 누르셨을 아버지의 모습이 눈앞에 그려졌다. <u>나는 내릴 역을 지나친 줄도 모르고 그 짧은 문자를 읽고 또 읽었다.</u>
  다음 날 어머니께 전화를 드렸다. 어머니 말씀으로는 아버지가 아들 목소리를 통 못 듣는다며 서운해하시더니 일주일 전부터 동네 복지관에 휴대 전화 사용법을 배우러 다니신다는 것이었다. 나는 그날 저녁 아버지께 처음으로 문자로 답장을 보냈다.
stem: "밑줄 친 부분에 나타난 '나'의 심정으로 가장 알맞은 것을 고르십시오."
choices:
  - label: "①"
    text: "서운하다"
    trap: speaker_swap
    note_vi: "Đây là cảm xúc của người bố, được mẹ kể lại ở đoạn cuối (아들 목소리를 통 못 듣는다며 서운해하시더니), không phải của 'tôi' ở phần gạch chân."
  - label: "②"
    text: "당황스럽다"
    trap: keyword_echo
    note_vi: "Bám vào chi tiết đi quá ga, nhưng '지나친 줄도 모르고' nghĩa là 'tôi' còn không biết mình đã đi quá ga, nên không có sự bối rối, hoảng hốt. 'Tôi' đang chìm trong cảm xúc với tin nhắn."
  - label: "③"
    text: "담담하다"
    trap: attitude_mismatch
    note_vi: "담담하다 là bình thản, không xao động. Đọc đi đọc lại tin nhắn đến mức quên cả ga cần xuống cho thấy cảm xúc rất mạnh, sai về cường độ."
  - label: "④"
    text: "뭉클하다"
    correct: true
explanation_vi: |
  **Đáp án ④.** Căn cứ: phần gạch chân "나는 내릴 역을 지나친 줄도 모르고 그 짧은 문자를 읽고 또 읽었다" (tôi đọc đi đọc lại tin nhắn ngắn ấy, không hề biết mình đã đi quá ga cần xuống), và câu ngay trước "돋보기를 쓰고 한 글자씩 천천히 화면을 누르셨을 아버지의 모습이 눈앞에 그려졌다" (hình ảnh bố đeo kính lão, chậm rãi bấm từng chữ hiện ra trước mắt).
  Người bố trước giờ không chịu học nhắn tin nay tự gõ tin hỏi han con. "Tôi" xúc động đến nghẹn lòng, không rời mắt khỏi tin nhắn. Cảm xúc đó là 뭉클하다.
  **Mẹo dạng:** văn bản không gọi tên cảm xúc ở phần gạch chân. Hãy suy ra từ hành động (đọc đi đọc lại, quên cả việc đang làm) và từ câu ngay trước phần gạch chân. Loại ngay phương án là cảm xúc của nhân vật khác trong bài.
  **Đáng chú ý:** 뭉클하다 – nghẹn ngào, rưng rưng vì xúc động · 야근 (夜勤 – dạ cần) – làm thêm buổi tối, làm ca đêm · 손을 내젓다 – xua tay (ý từ chối).
