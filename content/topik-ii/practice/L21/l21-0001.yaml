notes_internal: "Cặp với l22-0001: transcript_ko/transcript_vi, speakers, tts_notes chép nguyên văn từ l22-0001. Căn cứ của L21 là đề xuất và câu kết của nam (lớp trải nghiệm, '고객이 직접 써 보고 만족하면 그게 가장 좋은 홍보'), khác căn cứ của L22 (địa điểm ở tầng 1 trụ sở). Các phương án không nhắc tới địa điểm hay giảng viên, để không làm lộ đáp án và nhiễu ③ của L22. Độ khó 4 theo bảng."
