notes_internal: "Transcript khoảng 140 ký tự (không tính nhãn), đếm tay. Đủ 3 loại hành động theo §4.4: việc đã xong (nữ đã chuyển ghế), việc người kia sẽ làm (nam lấy cốc từ kho), việc người hỏi sẽ làm (nữ đặt thực đơn lên bàn). Căn cứ nằm ở lượt 3 của nam, lượt cuối của nữ chỉ là lời nhận việc. 2026-10-26 (FIX [E3] theo content/_reviews/2026-10-26-mini-nghe-01.md): mục 단체 trong 'Đáng chú ý' viết lại theo mẫu bạn giả một phần (nêu cả nghĩa trùng 'tổ chức'). Nhờ hanviet-lexicographer kiểm trường false_friend của 단체 trong words cho khớp (loại: bạn giả một phần)."
