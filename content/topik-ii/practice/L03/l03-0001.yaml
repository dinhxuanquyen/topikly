  pauses_vi: "Ngắt giữa ba dòng. Ngắt ngắn trước '그다음은' và giữa '교통비 절약' với '환경 보호'."
  pronunciation_vi: "2016년 = 이천십육 년; 2025년 = 이천이십오 년; 3년마다 = 삼 년마다; 1,000명 = 천 명 (không đọc dấu phẩy); 4% = 사 퍼센트; 12% = 십이 퍼센트; 출퇴근 [출퇴근]; 절약 [저략]; 늘어 [느러]. Dấu nháy đơn quanh tên lý do không đọc ra, chỉ ngắt nhẹ."
image_desc: "Bốn khung hình cùng kích thước, nền trắng, mọi nhãn bằng tiếng Hàn. Khung ① và ② là biểu đồ đường cùng tiêu đề '자전거로 출퇴근하는 직장인 비율', dưới tiêu đề là dòng chú thích nhỏ '○○연구소, 조사 연도별 직장인 1,000명 대상', trục hoành 4 mốc 2016, 2019, 2022, 2025, trục tung 0–15, nhãn '단위: %' ở góc trên phải, số % ghi tại từng điểm. Khung ③ và ④ là biểu đồ cột dọc cùng tiêu đề '자전거로 출퇴근하는 이유', chú thích '○○연구소, 2025년 조사', 3 cột cùng màu xếp từ cao xuống thấp, số % ghi trên đầu cột, nhãn '단위: %'. Hai biểu đồ cùng loại giống hệt nhau về bố cục, màu và trục, chỉ khác ở số liệu nêu trong từng phương án."
transcript_ko: |
  남자: 한 연구소가 2016년부터 3년마다 직장인 1,000명에게 출퇴근 방법을 물었습니다.
  남자: 그 결과 자전거로 출퇴근하는 직장인은 2016년 4%에서 꾸준히 늘어 2025년에는 12%가 되었습니다.
  남자: 자전거로 출퇴근하는 이유로는 '건강 관리'가 가장 많았고, 그다음은 '교통비 절약', '환경 보호' 순이었습니다.
transcript_vi: |
  Nam: Một viện nghiên cứu đã hỏi 1.000 người đi làm về cách đi làm, cứ 3 năm một lần kể từ năm 2016.
  Nam: Kết quả cho thấy tỉ lệ người đi làm bằng xe đạp tăng đều, từ 4% năm 2016 lên 12% vào năm 2025.
  Nam: Về lý do đi làm bằng xe đạp, 'giữ gìn sức khoẻ' được chọn nhiều nhất, tiếp theo lần lượt là 'tiết kiệm tiền đi lại' và 'bảo vệ môi trường'.
stem: "다음을 듣고 알맞은 그림 또는 그래프를 고르십시오."
