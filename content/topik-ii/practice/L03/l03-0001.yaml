notes_internal: "Số liệu giả định. Transcript khoảng 155 ký tự (không tính nhãn), đếm tay. Độ khó 4 (dải 3–4 của L03): biểu đồ nhiễu ③ chỉ đảo hạng 2 và hạng 3, người học phải nghe được trình tự '그다음은 … 순이었습니다'. Transcript dùng '한 연구소가' thay cho '○○연구소가' để TTS không phải đọc ký hiệu ○○; tên cơ quan chỉ in trên biểu đồ (caption '○○연구소'). Bố cục kiểu đề: ①② là biểu đồ đường (xu hướng), ③④ là biểu đồ cột (thứ hạng lý do); cả hai biểu đồ đường đều sai, chỉ một biểu đồ cột đúng. Hai biểu đồ cùng loại có cùng tiêu đề, caption, trục và màu, chỉ khác ở yếu tố có trong audio (xu hướng hoặc thứ hạng). 2026-10-26 (chỉ metadata, theo content-spec v0.3.5 §2.2 và mục Duyệt lại của content/_reviews/2026-10-26-mini-nghe-01.md): trap của ② đổi negation_flip → detail_swap, vì đảo chiều xu hướng (hai con số 4% và 12% bị đặt ngược mốc) không phải đảo khẳng định ↔ phủ định. Ba nhiễu nay cùng là detail_swap, dùng ngoại lệ chart_reading ở §2.2; note_vi của cả ba đã nêu cụ thể mốc/xu hướng/thứ hạng bị sai. Validator có thể vẫn cảnh báo few-traps cho tới khi backend thêm chart_reading vào multi_trap_exempt_subskills."
