explanation_vi: |
  **Đáp án ④.** Căn cứ: "자전거로 출퇴근하는 이유로는 '건강 관리'가 가장 많았고, 그다음은 '교통비 절약', '환경 보호' 순이었습니다" (về lý do đi làm bằng xe đạp, 'giữ gìn sức khoẻ' nhiều nhất, tiếp theo lần lượt là 'tiết kiệm tiền đi lại' và 'bảo vệ môi trường').
  Biểu đồ ④ xếp đúng thứ tự 건강 관리 → 교통비 절약 → 환경 보호. Hai biểu đồ đường đều sai, vì bài nói tỉ lệ "2016년 4%에서 꾸준히 늘어 2025년에는 12%" (tăng đều từ 4% lên 12%).
  **Mẹo dạng:** Câu biểu đồ thường có hai biểu đồ xu hướng và hai biểu đồ thứ hạng. Khi nghe, ghi nhanh hai thứ: hướng thay đổi kèm mốc đầu và mốc cuối (늘다/줄다, 꾸준히), và thứ tự xếp hạng (가장, 그다음은, … 순).
  **Đáng chú ý:** 출퇴근 (出退勤 – xuất thoái cần) – đi làm và tan làm · 절약 (節約 – tiết ước) – tiết kiệm · … 순 (順 – thuận) – theo thứ tự … ('교통비 절약', '환경 보호' 순: lần lượt là tiết kiệm tiền đi lại, rồi bảo vệ môi trường).
