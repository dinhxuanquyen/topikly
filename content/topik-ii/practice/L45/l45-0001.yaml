notes_internal: "Cặp với l46-0001: transcript_ko/transcript_vi, speakers, tts_notes chép nguyên văn từ l46-0001. Căn cứ của L45 là đoạn mở đầu về '어린 백성' (nghĩa trung đại = 어리석은 백성, đối lập với cách hiểu 'nhỏ tuổi' của người nghe hiện nay); khác căn cứ của L46 (cách triển khai: phân loại ba kiểu rồi nêu ví dụ). Không phương án nào hỏi lại cách phân loại hay quan điểm được trích dẫn '말이 타락한다' (căn cứ và nhiễu của L46). Độ khó 6 theo bảng: đáp án là diễn đạt lại ở mức suy luận ('어리석은 백성' → không liên quan tuổi tác); ba nhiễu đều bám từ khoá có thật ('얼굴', '다리', '필요') nhưng đảo hướng thay đổi nghĩa, đảo trình tự trước/sau hoặc đảo khẳng định. Kiến thức (어리다 trung đại = 어리석다; 얼굴 trung đại = 모습/형체; 다리 mở rộng sang đồ vật) đã ghi ở notes_internal của l46-0001, reviewer xác nhận một lần cho cả bộ."
