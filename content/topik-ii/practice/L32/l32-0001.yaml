notes_internal: "Cặp với l31-0001: transcript_ko/transcript_vi, speakers, tts_notes chép nguyên văn từ l31-0001. Căn cứ của L32 là cách nam lập luận (thừa nhận một phần rồi dùng 하지만 + kết quả khảo sát '10명 중 8명' để phản bác), khác căn cứ của L31 (nội dung quan điểm: không gian thư viện phải dùng đúng mục đích vốn có). Các phương án nói về cách nói, không nêu lại quan điểm của nam, nên không làm lộ đáp án L31. Nhiễu ④ bám vào việc nam có dùng dẫn chứng (thật) nhưng sai loại dẫn chứng; nhiễu ① bám vào câu nhượng bộ có thật; nhiễu ② (반문) bám vào câu hỏi phản vấn có thật của nữ (speaker_swap). Độ khó 5 theo bảng. 2026-10-26 (FIX [B1][B2] theo content/_reviews/2026-10-26-mini-nghe-01.md): thay phương án ② cũ ('열람실 축소 결정을 미루자고 제안하고 있다', negation_flip, không bám chi tiết có thật) bằng phương án reviewer đề xuất; câu nay có 3 kiểu bẫy. explanation_vi không nhắc ② nên không đổi. Độ dài phương án: ① khoảng 22 (theo reviewer), ② 25, ③ 26, ④ 25 ký tự. 2026-10-26 (gợi ý ở mục Duyệt lại của báo cáo): thêm 반문 (反問 – phản vấn) vào 'Đáng chú ý' vì là từ quyết định của nhiễu ②; bỏ mục 전적으로 để giữ tối đa 3 mục theo §4.2. Đây là thay đổi explanation_vi (nội dung), cần reviewer xác nhận lại mục này."
