notes_internal: "Bộ ba r48-50-0001, passage chép nguyên văn từ r48-0001 (sửa passage thì sửa cả ba file). Phần gạch chân đứng sau 그러나, phản bác ý kiến '일부에서는 … 개입하는 일이라고 지적한다'; câu sau phần gạch chân là ví dụ củng cố (… 삼은 셈이다). Phần gạch chân không gọi tên thái độ: thái độ phê phán chỉ lộ qua quan hệ phản bác với ý kiến được dẫn. Cả bốn phương án cùng dạng '-고 있다' để đáp án không nổi bật về hình thức. Từ cần hanviet-lexicographer bổ sung vào words: 개입하다, 역시."
passage: |
  새 휴대 전화를 사면 처음 설정된 화면 밝기나 알림 방식을 그대로 쓰는 사람이 많다. 이처럼 미리 정해진 값, 즉 기본값을 바꾸지 않고 따르는 경향은 생각보다 강하다. 직장에서 운영하는 노후 대비 저축 제도가 좋은 예이다. 원하는 사람만 신청해서 가입하게 했을 때보다 모든 직원을 자동으로 가입시키고 원하지 않는 사람은 언제든 빠져나갈 수 있게 했을 때 가입률이 크게 높아졌다는 사례가 여러 나라에서 보고되었다.
  사람들이 기본값을 쉽게 바꾸지 않는 데에는 이유가 있다. 우선 기본값을 바꾸려면 따로 시간과 노력을 들여야 한다. 또한 사람들은 흔히 기본값을 (   ) 받아들인다. 제도를 만든 쪽이 여러 사정을 충분히 따져 보고 정했으리라 믿기 때문이다.
  이러한 사실은 제도를 설계하는 쪽에 무거운 책임을 지운다. 기본값을 어떻게 정하느냐에 따라 수많은 사람의 선택이 달라지기 때문이다. 일부에서는 국가가 기본값을 정하는 것 자체가 개인의 선택에 지나치게 개입하는 일이라고 지적한다. 그러나 <u>아무것도 정하지 않고 개인에게 맡기겠다는 결정 역시 하나의 기본값을 정하는 일이다</u>. 신청하지 않은 사람을 가입하지 않은 것으로 처리하는 제도도 결국 '가입하지 않음'을 기본값으로 삼은 셈이다.
  따라서 제도를 설계하는 쪽은 기본값이 누구에게 유리한지 꼼꼼히 따져 정하고 그 근거를 투명하게 밝혀야 한다. 동시에 기본값을 원하지 않는 사람이 쉽게 다른 길을 택할 수 있도록 절차를 간단하게 만들어야 한다.
stem: "밑줄 친 부분에 나타난 필자의 태도로 가장 알맞은 것을 고르십시오."
choices:
  - label: "①"
    text: "국가가 개인의 선택에 개입하는 것을 경계하고 있다."
    trap: concession_point
    note_vi: "Lo ngại nhà nước can thiệp quá mức vào lựa chọn cá nhân là ý kiến của '일부' được dẫn ra ngay trước 그러나. Phần gạch chân chính là lời phản bác ý kiến này, nên không thể là thái độ của tác giả."
  - label: "②"
    text: "개인에게 맡기면 개입이 아니라는 생각을 비판하고 있다."
    correct: true
  - label: "③"
    text: "기본값을 정하지 않는 제도의 장점을 인정하고 있다."
    trap: attitude_mismatch
    note_vi: "Đúng đối tượng (chế độ 'không định gì') nhưng sai thái độ. Tác giả không khen chế độ này mà chỉ ra rằng nó cũng là một kiểu mặc định ('가입하지 않음'을 기본값으로 삼은 셈이다), tức không hề trung lập."
  - label: "④"
    text: "기본값을 바꾸지 않는 사람들을 안타까워하고 있다."
    trap: outside_text
    note_vi: "Bài không trách hay tỏ ra tiếc cho người giữ mặc định. Đoạn 2 chỉ giải thích họ có lý do ('이유가 있다'), còn phần gạch chân nói về quyết định của bên làm chế độ, không nói về người dùng."
explanation_vi: |
  **Đáp án ②.** Phần gạch chân: "아무것도 정하지 않고 개인에게 맡기겠다는 결정 역시 하나의 기본값을 정하는 일이다" (quyết định không định gì cả và để cá nhân tự lo cũng là việc định ra một giá trị mặc định). Câu này đứng sau 그러나, đáp lại ý kiến "일부에서는 국가가 기본값을 정하는 것 자체가 개인의 선택에 지나치게 개입하는 일이라고 지적한다" (một số người cho rằng việc nhà nước định giá trị mặc định đã là can thiệp quá mức vào lựa chọn cá nhân). Câu tiếp theo đưa ví dụ: chế độ coi người không đăng ký là "không tham gia" thực ra cũng đã chọn "không tham gia" làm mặc định. Vậy tác giả phê phán suy nghĩ rằng cứ để cá nhân tự chọn thì không phải là can thiệp.
  **Mẹo dạng:** câu gạch chân đứng ngay sau 그러나 thường là lời phản bác. Hãy xác định tác giả đang phản bác ý của ai (일부에서는 …, 흔히 …), rồi chọn phương án thể hiện thái độ của tác giả đối với **ý kiến đó**. Phương án nêu lại chính ý kiến bị phản bác là bẫy quen thuộc.
  **Đáng chú ý:** 개입하다 (介入 – giới nhập) – can thiệp · 역시 (亦是 – diệc thị) – cũng, cũng vậy · -(으)ㄴ 셈이다 – coi như là, rốt cuộc là.
